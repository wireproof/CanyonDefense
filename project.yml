name: CanyonCompatibility
options:
  bundleIdPrefix: com.wireproof
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  CanyonCompatibility:
    type: application
    platform: iOS
    sources:
      - path: RuffleApp/Compatibility.swift
      - path: RuffleApp/Assets.xcassets
      - path: RuffleApp/Web
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Canyon TD
        CFBundleShortVersionString: 0.3.6
        CFBundleVersion: "9"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wireproof.canyondefense
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.3.6
        CURRENT_PROJECT_VERSION: 9
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
